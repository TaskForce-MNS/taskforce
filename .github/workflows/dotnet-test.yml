name: .NET Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore apps/Api.Back/Api.Back.csproj

    - name: Build
      run: dotnet build apps/Api.Back/Api.Back.csproj --no-restore

    - name: Test    
      run: dotnet test apps/Api.Back.UnitTests/Api.Back.UnitTests.csproj --no-build --verbosity normal