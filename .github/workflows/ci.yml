name: CI TaskForce

on:
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "**.md"
      - ".vscode/**"
  pull_request:
    branches: ["main", "dev"]

jobs:
  # --- BACKEND C# ---
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # ⚡ Cache NuGet pour accélérer le build
      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      # 📦 Une seule restauration pour toute la solution
      - name: Restore
        run: dotnet restore taskforce.sln

      # 🏗️ Compilation propre
      - name: Build
        run: dotnet build apps/Api.Back/Api.Back.csproj --no-restore --configuration Release

      # 🧪 Tests Unitaires avec métriques de couverture (Syntaxe YAML corrigée)
      - name: Run Unit Tests with coverage
        run: dotnet test apps/Api.Back.UnitTests/Api.Back.UnitTests.csproj --no-restore --collect:"XPlat Code Coverage" --results-directory ./coverage

      # 🛡️ Scan de vulnérabilités NuGet
      - name: Security scan
        run: |
          OUTPUT=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q -i "critical\|high"; then
            echo "Vulnérabilités critiques détectées !"
            exit 1
          fi

  # --- FRONTEND REACT & ASTRO ---
  build-web-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 🛡️ Audit sécurité npm (Ne bloque pas le CI si faille dans les devDependencies)
      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # 🧐 Vérification des types TypeScript
      - name: Type Check
        run: pnpm --filter web-app exec tsc --noEmit

      # 🧹 Vérification du style de code
      - name: Lint Check
        run: pnpm --filter web-app exec eslint . --max-warnings=0

      # 🏗️ Build React App
      - name: Build React App
        run: pnpm --filter web-app build

      # 🏗️ Build Landing Page
      - name: Build Landing Page
        run: pnpm --filter landing-page build

  # --- SECURITE GLOBALE ---
  security-scan:
    runs-on: ubuntu-latest
    needs: [build-backend, build-web-apps]
    steps:
      - uses: actions/checkout@v7

      # 🛡️ Trivy scanne les fichiers pour trouver des secrets oubliés ou des failles critiques
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'