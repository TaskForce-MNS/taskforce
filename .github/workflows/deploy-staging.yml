name: 🚀 Build & Push to Docker Hub (Staging)

on:
  push:
    branches:
      - staging 

jobs:
  build-and-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🔑 Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: ⚙️ Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

    # ─── API .NET ───────────────────────────────────────────────
      - name: 📦 Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/Api.Back/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskforce_api:staging

    # ─── Web App (React) ────────────────────────────────────────
      - name: 📦 Build & Push Web App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web-app/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskforce_webapp:staging

    # ─── Landing Page (Astro) ───────────────────────────────────
      - name: 📦 Build & Push Landing Page
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/landing-page/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskforce_landing:staging