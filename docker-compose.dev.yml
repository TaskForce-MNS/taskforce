services:
  # ─── Base de données PostgreSQL ─────────────────────────────────
  db:
    image: postgres:18
    container_name: ${DB_HOST}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432" 
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  # ─── API .NET ───────────────────────────────────────────────────
  api:
    # image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: taskforce_api
    build:
      context: ./apps/Api.Back
      dockerfile: Dockerfile.dev
      args:
        USER_UID: ${DOCKER_UID:-1000}   
        USER_GID: ${DOCKER_GID:-1000}
    ports:
      - "7250:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - Jwt__Key=${JWT_KEY}        
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    volumes:
      - ./apps/Api.Back:/app
      - dotnet_obj:/app/obj
      - dotnet_bin:/app/bin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/back/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
      
  # ─── Web App (React Vite) ───────────────────────────────────────
  web-app:
    # image: node:24-alpine
    container_name: taskforce_webapp
    build:
      context: ./apps/web-app
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web-app:/app
      - webapp_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Landing Page (Astro) ───────────────────────────────────────
  landing-page:
    # image: node:24-alpine
    container_name: taskforce_landing
    build:
      context: ./apps/landing-page
      dockerfile: Dockerfile.dev
    ports:
      - "4321:4321"
    volumes:
      - ./apps/landing-page:/app
      - landing_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4321/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Reverse Proxy (Nginx) ──────────────────────────────────────
  proxy:
    image: nginx:alpine
    container_name: taskforce_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web-app:
        condition: service_healthy
      landing-page:
        condition: service_healthy

  # ─── Redis Cache ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: taskforce_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  data:
  redis_data:
  dotnet_obj:
  dotnet_bin:
  landing_node_modules:
  webapp_node_modules: