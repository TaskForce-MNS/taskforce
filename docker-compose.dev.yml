services:
  # ─── Base de données PostgreSQL ─────────────────────────────────
  db:
    image: postgres:18
    container_name: ${DB_HOST}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
     - data:/var/lib/postgresql
      
  # ─── API .NET ───────────────────────────────────────────────────
  api:
    # image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: taskforce_api
    build:
      context: ./apps/Api.Back
      dockerfile: Dockerfile.dev
    ports:
      - "7250:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    volumes:
      - ./apps/Api.Back:/app
    depends_on:
      - db

  # ─── Web App (React Vite) ───────────────────────────────────────
  web-app:
    # image: node:24-alpine
    container_name: taskforce_webapp
    build:
      context: ./apps/web-app
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web-app:/app
      - /app/node_modules

  # ─── Landing Page (Astro) ───────────────────────────────────────
  landing-page:
    # image: node:24-alpine
    container_name: taskforce_landing
    build:
      context: ./apps/landing-page
      dockerfile: Dockerfile.dev
    ports:
      - "4321:4321"
    volumes:
      - ./apps/landing-page:/app
      - /app/node_modules

# ─── Reverse Proxy (Nginx) ──────────────────────────────────────
  proxy:
    image: nginx:alpine
    container_name: taskforce_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./infra/certs:/etc/nginx/certs
    depends_on:
      - api
      - web-app
      - landing-page

volumes:
  data: