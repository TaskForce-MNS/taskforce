services:
  # ─── Base de données PostgreSQL ─────────────────────────────────
  db:
    image: postgres:18
    container_name: ${DB_HOST}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
     - data:/var/lib/postgresql
      
  # ─── API .NET ───────────────────────────────────────────────────
  api:
    # image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: taskforce_api
    build:
      context: ./apps/Api.Back
      dockerfile: Dockerfile.dev
    ports:
      - "7250:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - Redis__ConnectionString=redis:6379
    volumes:
      - ./apps/Api.Back:/app
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/back/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  # ─── Web App (React Vite) ───────────────────────────────────────
  web-app:
    # image: node:24-alpine
    container_name: taskforce_webapp
    build:
      context: ./apps/web-app
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web-app:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Landing Page (Astro) ───────────────────────────────────────
  landing-page:
    # image: node:24-alpine
    container_name: taskforce_landing
    build:
      context: ./apps/landing-page
      dockerfile: Dockerfile.dev
    ports:
      - "4321:4321"
    volumes:
      - ./apps/landing-page:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4321/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Reverse Proxy (Nginx) ──────────────────────────────────────
  proxy:
    image: nginx:alpine
    container_name: taskforce_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./infra/certs:/etc/nginx/certs
    depends_on:
      api:
        condition: service_healthy
      web-app:
        condition: service_healthy
      landing-page:
        condition: service_healthy

  # ─── Redis Cache ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: taskforce_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  data:
  redis_data: