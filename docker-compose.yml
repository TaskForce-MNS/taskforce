services:
  # ─── Base de données PostgreSQL ─────────────────────────────────
  db:
    image: postgres:18
    container_name: ${DB_HOST}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
     - data:/var/lib/postgresql
      
  # ─── API .NET ───────────────────────────────────────────────────
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: taskforce_api
    working_dir: /workspace/apps/Api.Back
    ports:
      - "7250:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    volumes:
      - ./:/workspace
    depends_on:
      - db
    command: >
      bash -c "dotnet restore && dotnet watch run --urls http://0.0.0.0:8080"

  # ─── Web App (React Vite) ───────────────────────────────────────
  web-app:
    image: node:24-alpine
    container_name: taskforce_webapp
    working_dir: /workspace/apps/web-app
    ports:
      - "5173:5173"
    volumes:
      - ./:/workspace
    command: >
      sh -c "corepack enable pnpm && pnpm install && pnpm run dev --host 0.0.0.0"

  # ─── Landing Page (Astro) ───────────────────────────────────────
  landing-page:
    image: node:24-alpine
    container_name: taskforce_landing
    working_dir: /workspace/apps/landing-page
    ports:
      - "4321:4321"
    volumes:
      - ./:/workspace
    command: >
      sh -c "corepack enable pnpm && pnpm install && pnpm run dev --host 0.0.0.0"

# ─── Reverse Proxy (Nginx) ──────────────────────────────────────
  proxy:
    image: nginx:alpine
    container_name: taskforce_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./infra/certs:/etc/nginx/certs
    depends_on:
      - api
      - web-app
      - landing-page

volumes:
  data: