services:
  # ─── Base de données  ──────
  db:
    image: postgres:18
    container_name: taskforce_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - prod_data:/var/lib/postgresql # Le volume géré par Docker

  # ─── API .NET (Image téléchargée depuis le registre) ────────────
  api:
    image: ${REGISTRY_URL}/taskforce_api:${APP_VERSION:-latest}
    container_name: taskforce_api_prod
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - db

  # ─── Web App React (Image téléchargée depuis le registre) ───────
  web-app:
    image: ${REGISTRY_URL}/taskforce_webapp:${APP_VERSION:-latest}
    container_name: taskforce_webapp_prod
    restart: unless-stopped

  # ─── Landing Page Astro (Image téléchargée depuis le registre) ──
  landing-page:
    image: ${REGISTRY_URL}/taskforce_landing:${APP_VERSION:-latest}
    container_name: taskforce_landing_prod
    restart: unless-stopped

  # ─── Reverse Proxy Nginx (Le SEUL contact avec l'extérieur) ─────
  proxy:
    image: nginx:alpine
    container_name: taskforce_proxy_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - ./infra/certs:/etc/nginx/certs
      # make dockerfile instead of 
    depends_on:
      - api
      - web-app
      - landing-page

volumes:
  prod_data: