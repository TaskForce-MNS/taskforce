server_tokens off;

# ── SSL Hardening ──────────────────────────────────────────────
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# ── Gzip ──────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

# ── Rate limiting (Ajusté pour le DEV local) ──────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;


# Redirection HTTP -> HTTPS
server {
    autoindex off;
    listen 80;
    server_name taskforce.local app.taskforce.local api.taskforce.local;
    return 301 https://$host$request_uri;
}

# 1. La Landing Page (Astro) sur taskforce.local
server {
    autoindex off;
    listen 443 ssl;
    server_name taskforce.local;

    ssl_certificate /etc/nginx/certs/taskforce.local.pem;
    ssl_certificate_key /etc/nginx/certs/taskforce.local-key.pem;

    # Headers de sécurité
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\.(?!well-known|vite|pnpm).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(yml|yaml|log|bak|sql|pem|key|sh|cs)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://landing-page:4321;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}

# 2. La Web App (React/Vite) sur app.taskforce.local
server {
    autoindex off;
    listen 443 ssl;
    server_name app.taskforce.local;

    ssl_certificate /etc/nginx/certs/taskforce.local.pem;
    ssl_certificate_key /etc/nginx/certs/taskforce.local-key.pem;

    # Headers de sécurité
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\.(?!well-known|vite|pnpm).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(yml|yaml|log|bak|sql|pem|key|sh|cs)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://web-app:5173;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 3. L'API (.NET) sur api.taskforce.local
server {
    autoindex off;
    listen 443 ssl;
    server_name api.taskforce.local;

    ssl_certificate /etc/nginx/certs/taskforce.local.pem;
    ssl_certificate_key /etc/nginx/certs/taskforce.local-key.pem;

    # Headers de sécurité
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\.(?!well-known|vite|pnpm).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(yml|yaml|log|bak|sql|pem|key|sh|cs)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/api/back/v1/auth/(login|register) {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://api:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }

    location / {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://api:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }
}