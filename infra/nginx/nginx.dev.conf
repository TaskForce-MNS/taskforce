server_tokens off;
server {
    autoindex off;
    listen 80;
    server_name taskforce.local app.taskforce.local api.taskforce.local;

    return 301 https://$host$request_uri;
}
# 1. La Landing Page (Astro) sur taskforce.local
server {
    autoindex off;
    listen 443 ssl;
    server_name taskforce.local;

    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;

    ssl_certificate /etc/nginx/certs/taskforce.local.pem;
    ssl_certificate_key /etc/nginx/certs/taskforce.local-key.pem;

    # .env, .git, .github, etc.
    # L'exception (?!well-known) est nécessaire si tu utilises Let's Encrypt plus tard.
    location ~ /\.(?!well-known|vite|pnpm).* {
        deny all;
        access_log off;     # On ne pollue pas les logs avec ces tentatives de hack
        log_not_found off;
    }

    location ~* \.(yml|yaml|log|bak|sql|pem|key|sh|cs)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://landing-page:4321;
        proxy_set_header Host $host;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}

# 2. La Web App (React/Vite) sur app.taskforce.local
server {
    autoindex off;
    listen 443 ssl;
    server_name app.taskforce.local;

    ssl_certificate /etc/nginx/certs/taskforce.local.pem;
    ssl_certificate_key /etc/nginx/certs/taskforce.local-key.pem;

    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;

    # .env, .git, .github, etc.
    # L'exception (?!well-known) est nécessaire si tu utilises Let's Encrypt plus tard.
    location ~ /\.(?!well-known|vite|pnpm).* {
        deny all;
        access_log off;     # On ne pollue pas les logs avec ces tentatives de hack
        log_not_found off;
    }

    location ~* \.(yml|yaml|log|bak|sql|pem|key|sh|cs)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://web-app:5173;
        proxy_set_header Host $host;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 3. L'API (.NET) sur api.taskforce.local
server {
    autoindex off;
    listen 443 ssl;
    server_name api.taskforce.local;

    ssl_certificate /etc/nginx/certs/taskforce.local.pem;
    ssl_certificate_key /etc/nginx/certs/taskforce.local-key.pem;

    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;

    # 🛡️ Règle 1 : Bloquer tous les fichiers et dossiers cachés (qui commencent par un point)
    # Cela inclut .env, .git, .github, etc.
    # L'exception (?!well-known) est nécessaire si tu utilises Let's Encrypt plus tard.
    location ~ /\.(?!well-known|vite|pnpm).* {
        deny all;
        access_log off;     # On ne pollue pas les logs avec ces tentatives de hack
        log_not_found off;
    }

    # 🛡️ Règle 2 : Bloquer les extensions de fichiers sensibles
    location ~* \.(yml|yaml|log|bak|sql|pem|key|sh|cs)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        # Redirige vers le conteneur .NET sur son port interne 8080
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }
}
