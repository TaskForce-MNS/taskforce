server {
    listen 80;
    server_name taskforce.local app.taskforce.local api.taskforce.local;

    return 301 https://$host$request_uri;
}
# 1. La Landing Page (Astro) sur taskforce.local
server {
    listen 443 ssl;
    server_name taskforce.local;

    ssl_certificate /etc/nginx/certs/taskforce.local.pem;
    ssl_certificate_key /etc/nginx/certs/taskforce.local-key.pem;

    location / {
        proxy_pass http://landing-page:4321;
        proxy_set_header Host $host;
    }
}

# 2. La Web App (React/Vite) sur app.taskforce.local
server {
    listen 443 ssl;
    server_name app.taskforce.local;

    ssl_certificate /etc/nginx/certs/taskforce.local.pem;
    ssl_certificate_key /etc/nginx/certs/taskforce.local-key.pem;

    location / {
        proxy_pass http://web-app:5173;
        proxy_set_header Host $host;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 3. L'API (.NET) sur api.taskforce.local
server {
    listen 443 ssl;
    server_name api.taskforce.local;

    ssl_certificate /etc/nginx/certs/taskforce.local.pem;
    ssl_certificate_key /etc/nginx/certs/taskforce.local-key.pem;
    location / {
        # Redirige vers le conteneur .NET sur son port interne 8080
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }
}
