services:
  db:
    image: postgres:18
    container_name: taskforce_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - staging_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskforce_staging_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${REGISTRY}/taskforce_api:${VERSION}
    container_name: taskforce_staging_api
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Staging
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Fido2__Domain=taskforce.stagiairesmns.fr
      - Fido2__Origin=https://app.staging.taskforce.stagiairesmns.fr
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/back/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web-app:
    image: ${REGISTRY}/taskforce_webapp:${VERSION}
    container_name: taskforce_staging_webapp
    restart: unless-stopped

  landing-page:
    image: ${REGISTRY}/taskforce_landing:${VERSION}
    container_name: taskforce_staging_landing
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: taskforce_staging_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web-app
      - landing-page

volumes:
  staging_data:
  staging_redis_data: